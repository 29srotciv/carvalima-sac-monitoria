name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carvalima-sac-monitoria
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: carvalima-sac-monitoria/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: cd .. && npm run build
