name: Corrigir PDF A4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar exportação PDF
        shell: python
        run: |
          from pathlib import Path

          p = Path('carvalima-sac-monitoria/src/App.jsx')
          s = p.read_text(encoding='utf-8')

          if 'PDF A4 landscape fix v2' in s:
              print('Correção já aplicada.')
              raise SystemExit(0)

          s = s.replace(
              "      container.style.width = '1120px';",
              """      /* PDF A4 landscape fix v2: largura útil compatível com 297 x 210 mm. */
          container.style.width = '281mm';
          container.style.maxWidth = '281mm';
          container.style.margin = '0';
          container.style.position = 'relative';
          container.style.left = '0';"""
          )

          old_css = """          * { box-sizing: border-box; }
          .pdf-section, .pdf-kpi, .pdf-monitoria { page-break-inside: avoid; break-inside: avoid; }
          h1, h2, h3, p { page-break-after: avoid; }"""
          new_css = """          * { box-sizing: border-box; }
          @page { size: A4 landscape; margin: 8mm; }
          html, body { margin: 0 !important; padding: 0 !important; }
          .pdf-report { width: 281mm; max-width: 281mm; margin: 0; padding: 0; overflow: visible; }
          .pdf-section, .pdf-kpi, .pdf-monitoria { page-break-inside: avoid; break-inside: avoid; }
          h1, h2, h3, p { page-break-after: avoid; }
          .pdf-monitoria * { max-width: 100%; }
          .pdf-meta-row { display: flex; flex-wrap: wrap; gap: 10px 15px; }"""
          if old_css not in s:
              raise SystemExit('CSS original não encontrado; nenhuma alteração feita.')
          s = s.replace(old_css, new_css, 1)

          marker = '<!-- Cabeçalho Institucional -->'
          replacement = """<div class=\"pdf-report\" style=\"width: 281mm; max-width: 281mm; margin: 0; padding: 0;\">
        <!-- Cabeçalho Institucional -->"""
          if marker not in s:
              raise SystemExit('Cabeçalho do PDF não encontrado.')
          s = s.replace(marker, replacement, 1)

          old_meta = """            <div style=\"display: flex; gap: 15px; font-size: 10px; margin-bottom: 6px;\">"""
          new_meta = """            <div class=\"pdf-meta-row\" style=\"display: flex; flex-wrap: wrap; gap: 10px 15px; font-size: 10px; margin-bottom: 6px;\">"""
          if old_meta not in s:
              raise SystemExit('Linha de metadados não encontrada.')
          s = s.replace(old_meta, new_meta, 1)

          footer = """        <div style=\"margin-top: 30px; text-align: center; font-size: 9px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px;\">
          Carvalima Transportes — Sistema Integrado de Gestão de Qualidade V2 • Movidos pela confiança
        </div>
      `;"""
          footer_new = """        <div style=\"margin-top: 30px; text-align: center; font-size: 9px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px;\">
          Carvalima Transportes — Sistema Integrado de Gestão de Qualidade V2 • Movidos pela confiança
        </div>
        </div>
      `;"""
          if footer not in s:
              raise SystemExit('Rodapé do PDF não encontrado.')
          s = s.replace(footer, footer_new, 1)

          old_canvas = """          windowWidth: 1120"""
          new_canvas = """          windowWidth: 1062,
          width: 1062,
          onclone: (clonedDoc) => {
            const clonedReport = clonedDoc.querySelector('.pdf-report');
            if (clonedReport) {
              clonedReport.style.width = '281mm';
              clonedReport.style.maxWidth = '281mm';
              clonedReport.style.margin = '0';
            }
          }"""
          if old_canvas not in s:
              raise SystemExit('Configuração html2canvas original não encontrada.')
          s = s.replace(old_canvas, new_canvas, 1)

          p.write_text(s, encoding='utf-8')
          print('Correção PDF A4 aplicada.')

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carvalima-sac-monitoria/src/App.jsx
          git diff --cached --quiet || git commit -m "Corrigir exportacao PDF A4 landscape"
          git push
